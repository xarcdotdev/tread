<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tread control</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 30rem; margin: 2rem auto; padding: 0 1rem; }
    button { font-size: 1.25rem; padding: .75rem; margin: .25rem; min-width: 4rem; }
  </style>
</head>
<body>
  <h1>tread control</h1>
  <p id="status">Not connected. Web Bluetooth needs Chrome and HTTPS.</p>
  <button id="connect">Connect</button>
  <div>
    <button data-action="start">Start</button>
    <button data-action="pause">Pause</button>
    <button data-action="stop">Stop</button>
  </div>
  <div id="speeds"></div>
  <script src="control.js"></script>
</body>
</html>
