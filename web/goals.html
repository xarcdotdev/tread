<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#7e43fe" />
    <title>Goals · tread</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="loading goals-page">
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="/"
          ><span class="brand-mark"
            ><svg class="icon" aria-hidden="true">
              <use href="/icons.svg#activity" /></svg></span
          ><span>tread<b>.</b></span></a
        >
        <nav class="nav" aria-label="Main">
          <div class="nav-label">Menu</div>
          <a href="/" aria-label="Overview"
            ><svg class="icon" aria-hidden="true">
              <use href="/icons.svg#layout-dashboard" /></svg
            ><span>Overview</span></a
          ><a class="active" aria-current="page" href="/goals.html" aria-label="Goals"
            ><svg class="icon" aria-hidden="true">
              <use href="/icons.svg#trending-up" /></svg
            ><span>Goals</span></a
          ><a href="/settings.html" aria-label="Configuration"
            ><svg class="icon" aria-hidden="true">
              <use href="/icons.svg#sliders-horizontal" /></svg
            ><span>Configuration</span></a
          >
        </nav>
        <div class="device-card">
          <span class="device-icon"
            ><svg class="icon" aria-hidden="true">
              <use href="/icons.svg#bluetooth" /></svg
          ></span>
          <div class="device-text">
            <span data-link-label>Treadmill</span><strong data-device>Usage tracker</strong>
          </div>
          <span class="demo-label" data-demo hidden>Demo</span>
        </div>
      </aside>
      <main>
        <header class="page-head">
          <h1>Goals</h1>
          <div class="head-actions">
            <span class="chip">Calendar targets</span>
            <button class="btn" id="refresh" disabled>
              <svg class="icon" aria-hidden="true">
                <use href="/icons.svg#refresh-cw" /></svg
              >Refresh
            </button>
          </div>
        </header>
        <p class="goals-calendar" id="goals-calendar">
          Calendar days, Monday-start weeks, months and years. Progress counts walking through now.
        </p>
        <div id="notices" aria-live="polite"></div>
        <div id="goals-status" role="status">Loading goals…</div>
        <section class="goals-grid" id="goals-periods" aria-label="Calendar goals" aria-busy="true"></section>
        <footer class="footer">
          <span>tread · Make room for movement.</span>
          <a href="/settings.html">View profile and calibration</a>
        </footer>
      </main>
    </div>
    <script src="/live.js" defer></script>
    <script src="/goals.js" defer></script>
  </body>
</html>
